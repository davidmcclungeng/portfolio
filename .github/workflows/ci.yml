name: CI

# Pushing to main deploys to production via Cloudflare Workers Builds, so this
# is the gate that runs before a change can get there.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        # Warnings are failures here; they are how the last regression slipped in
        run: npx eslint --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Also catches static-export violations, which only surface at build time
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
